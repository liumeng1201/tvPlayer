name: Build release APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      android_api:
        description: Android TV 模拟器版本
        type: choice
        default: '30'
        options:
          - '26'
          - '30'
          - '34'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Run release unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon

      - name: Test release publication logic
        run: python3 -m unittest discover -s .github/scripts

      - name: Prepare and verify release assets
        run: python3 .github/scripts/release.py prepare

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.android_api || '30' }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: gradle :app:connectedReleaseAndroidTest --no-daemon

      - name: Run release lint
        if: ${{ !cancelled() }}
        run: gradle :app:lintRelease --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-release.*
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tvplayer-release-master
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
